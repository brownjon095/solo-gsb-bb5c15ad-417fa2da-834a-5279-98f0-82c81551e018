services:
  font-workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: font-fallback-workbench:latest
    container_name: font-fallback-workbench
    ports:
      - "8000:8000"
    volumes:
      # Mount your own coverage manifests / data directory if desired.
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
